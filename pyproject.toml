[project]
name = "storefront-admin-api"
version = "1.0.0"
description = "Products, stock and sales analytics for a storefront admin dashboard."
requires-python = ">=3.11"

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
filterwarnings = ["error::DeprecationWarning:app.*"]

[tool.ruff]
line-length = 88
target-version = "py311"
exclude = [".venv", "alembic"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle
    "F",    # pyflakes
    "I",    # import sorting
    "UP",   # pyupgrade
    "B",    # bugbear
    "C4",   # comprehensions
    "SIM",  # simplify
    "A",    # builtin shadowing
    "RET",  # return hygiene
    "ARG",  # unused arguments
    "PL",   # pylint subset
]
ignore = [
    "A003",     # method named like a builtin is fine on a repository
    "PLR2004",  # magic values in tests
    "B008",     # FastAPI's Depends(...) in defaults is the framework idiom
]

[tool.ruff.lint.per-file-ignores]
# List endpoints take one keyword-only argument per filter.
"app/api/routers/sales.py" = ["PLR0913", "PLR0917"]
"app/repositories/sales.py" = ["PLR0913"]
"app/services/sales.py" = ["PLR0913"]
"tests/*" = ["ARG001", "ARG002", "PLR0913"]
